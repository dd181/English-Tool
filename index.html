<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>English Blank</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

    <h1>English Blank</h1>

    <div class="info">

        <div>
            <strong>Document :</strong>
            <span id="document">THE BOY NEXT DOOR</span>
        </div>

        <div>
            <strong>Sentence :</strong>
            <span id="progress">1 / 4</span>
        </div>

    </div>

    <div class="sentenceBox">

        <div id="sentence"></div>
    </div>

    <div class="buttons">

        <button id="prevButton">◀ Previous</button>

        <button id="showButton">Show Answer</button>

        <button id="nextButton">Next ▶</button>

    </div>

    <hr>

    <div class="setting">

        <label>

            Blank Count :

            <input
                id="blankRatio"
                type="number"
                min="10"
                max="50"
                value="30">

        </label>

        <label>
        Blank Style :
    </label>

    <label>
        <input type="radio" name="blankStyle" value="fixed" checked>
        Fixed
    </label>

    <label>
        <input type="radio" name="blankStyle" value="length">
        Word Length
    </label>

    </div>

    <div class="setting">

        <label>

            <input
                type="radio"
                name="mode"
                checked>

            Random

        </label>

        <label>

            <input
                type="radio"
                name="mode">

            Verb

        </label>

        <label>

            <input
                type="radio"
                name="mode">

            Noun

        </label>

        <label>
        Filter:
    </label>

    <label>
        <input type="checkbox" name="filter" value="article" checked>
        Article
    </label>

    <label>
        <input type="checkbox" name="filter" value="pronoun" checked>
        Pronoun
    </label>

    <label>
        <input type="checkbox" name="filter" value="preposition" checked>
        Preposition
    </label>

    <label>
        <input type="checkbox" name="filter" value="conjunction" checked>
        Conjunction
    </label>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
